name: Actualizar Polla Mundial

on:
  workflow_dispatch:
    inputs:
      match_id:
        description: 'Índice del partido a actualizar (0-71). Vacío = todos.'
        required: false
        default: ''

  schedule:
    - cron: '0 11 * * *'

concurrency:
  group: update-polla
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar cuotas
        run: |
          if [ -n "${{ github.event.inputs.match_id }}" ]; then
            python update_polla.py --match-id ${{ github.event.inputs.match_id }}
          else
            python update_polla.py
          fi

      - name: Regenerar HTML
        run: python rebuild_html.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add polla_data_final.json index.html
          git diff --cached --quiet || git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
          git fetch origin
          git rebase -X ours origin/main
          git push
