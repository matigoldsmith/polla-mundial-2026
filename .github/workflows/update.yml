name: Actualizar Polla Mundial

on:
  workflow_dispatch:

    schedule:
        - cron: '0 11 * * *'

        permissions:
          contents: write

          jobs:
            update:
                runs-on: ubuntu-latest

                    steps:
                          - name: Checkout
                                  uses: actions/checkout@v4

                                        - name: Setup Python
                                                uses: actions/setup-python@v5
                                                        with:
                                                                  python-version: '3.11'

                                                                        - name: Instalar dependencias
                                                                                run: pip install -r requirements.txt

                                                                                      - name: Actualizar cuotas
                                                                                              run: python update_polla.py

                                                                                                    - name: Regenerar HTML
                                                                                                            run: python rebuild_html.py
                                                                                                            
                                                                                                                  - name: Commit y push
                                                                                                                          run: |
                                                                                                                                    git config user.name "github-actions[bot]"
                                                                                                                                              git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                        git add polla_data_final.json polla_mundial_2026.html
                                                                                                                                                                  git diff --cached --quiet || git commit -m "Auto-update $(date -u '+%Y-%m-%d %H:%M UTC')"
                                                                                                                                                                            git push
